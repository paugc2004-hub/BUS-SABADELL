      es: Afectaciones al servicio · corte del c. d’Adriana
    text:
      ca: A partir del dilluns 21 de setembre i fins a nou avís, tall del c. d’Adriana per obres. Línies afectades L4, L44, L14 (variant L14ds) i F4.
      es: A partir del lunes 21 de septiembre y hasta nuevo aviso, corte del c. d’Adriana por obras. Líneas afectadas L4, L44, L14 (variante L14ds) y F4.
    motiu:
      ca: Obres
      es: Obras
    url: https://www.tus.es/
    font: App oficial TUS Sabadell 3.2.4, «Incidencias», 2026-10-12
  - id: tus-2026-03-09-collsalarca-sud
