# Festius d'obertura comercial autoritzada a Sabadell (hi circula la F6).
# Font: pàgina «Festius d'obertura comercial 2026» de l'Ajuntament de Sabadell (web.sabadell.cat, article 105852),
# segons el resum del cercador del 2026-10-12 (la pàgina no s'ha pogut obrir des de l'entorn: a confirmar).
# Coherent amb l'app oficial de TUS, que el 12/10/2026 (festiu comercial) mostra la F6 entre les línies del dia.
# TODO(DECISION: FESTIUS-COMERCIALS-2027): falten els de 2027 (la F6 no es mostrarà com a circulant fins que hi siguin).
